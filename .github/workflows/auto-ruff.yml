name: Auto Ruff Fixes

on:
  push:
    branches: [ "master" ]
  # Allows you to trigger this manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      
    - name: Install uv and set python version
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        python-version: "3.12"
        enable-cache: true
        
    - name: Install dependencies
      run: uv sync --extra dev
      
    - name: Auto-fix and format with Ruff
      run: |
        uv run ruff check --fix .
        uv run ruff format .
        
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "style: auto-fix and format with ruff"
        title: "style: apply ruff auto-formatting"
        body: |
          Automatic formatting and linting fixes generated by Ruff.
          
          Merge this PR to keep the codebase compliant with the project's styling rules.
        branch: "chore/auto-ruff"
        delete-branch: true
