name: Bump Minor Version

on:
  push:
    branches: [ "master" ]

jobs:
  bump-version:
    # Prevent infinite loops by ignoring commits made by this action
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit and push changes

    steps:
    - uses: actions/checkout@v4
      with:
        # Fetch full history to ensure we can push back correctly
        fetch-depth: 0 
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Bump minor version in pyproject.toml
      id: bump
      run: |
        NEW_VERSION=$(python -c '
        import re
        with open("pyproject.toml", "r") as f: c = f.read()
        m = re.search(r"version\s*=\s*\"(\d+)\.(\d+)\.(\d+)\"", c)
        major, minor, patch = m.groups()
        new_version = f"{major}.{int(minor)+1}.0"
        c = c[:m.start()] + f"version = \"{new_version}\"" + c[m.end():]
        with open("pyproject.toml", "w") as f: f.write(c)
        print(new_version)
        ')
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml
        # [skip ci] is critical here to prevent triggering this action again
        git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
        git tag "v${{ steps.bump.outputs.version }}"
        git push origin master --tags
